build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    threshold: 160
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 13
    ignoreDefaultParameters: true
  NestedBlockDepth:
    threshold: 6
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 15
  LargeClass:
    threshold: 700

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable
      - Test
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  ReturnCount:
    max: 5
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - Preview
  WildcardImport:
    active: true
    excludeImports: []
  UnusedImports:
    active: false
  ThrowsCount:
    max: 5
