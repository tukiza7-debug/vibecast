# Single source of truth for display names, package ids and shared identifiers.
# Read by Gradle (all modules) and by GitHub Actions workflows.
# Changing a package id breaks the update path for already installed apps; never edit
# packageId values once a release exists.
owner=tukiza7-debug
ownerSanitized=tukiza7_debug

addonx.appName=AddOnX
addonx.packageId=io.github.tukiza7_debug.addonx

vibecast.appName=VibeCast
vibecast.packageId=io.github.tukiza7_debug.vibecast
vibecast.extensionPermission=io.github.tukiza7_debug.vibecast.permission.WRITE_EXTENSIONS
